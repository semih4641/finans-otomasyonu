services:
  telegram-bot:
    build:
      context: .
    image: finans-otomasyonu:latest
    container_name: finans-otomasyonu
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: Europe/Istanbul
    volumes:
      - ../runtime:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
